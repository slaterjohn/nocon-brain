name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers and system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system dependencies only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:integration
      # Phase 6 (T-12): P1 never evicted, shared assets kept, retention respected, interrupted eviction safe, index updated, deletion distinct from eviction. Blocking on both architectures.
      - name: Storage safety suite
        run: pnpm test:storage-safety
      # Phase 7 (D-08): limits, offline behaviour, privacy (no search text stored when disabled), provenance, scoring, kill switch, property tests. Blocking on both architectures.
      - name: Discovery suite
        run: pnpm test:discovery
      # The browser suite is timing-sensitive on shared runners (a different test flakes each run), so it runs on x64 only,
      # retries twice, and is advisory (continue-on-error) until the flaky specs are stabilised.
      - name: Browser end-to-end tests (advisory)
        if: runner.arch == 'X64'
        continue-on-error: true
        run: pnpm test:e2e --retries=2
      - run: node scripts/licence-audit.mjs
