name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Builds every image (server, web, renderer) so a broken Dockerfile fails CI. Nothing is pushed.
  images:
    name: images (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      # A throwaway value satisfies compose's required-variable check; build never uses it.
      - run: docker compose --profile renderer build
        env:
          NCB_PROXY_SECRET: ci-build-only

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-3engines-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers and system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install Playwright system dependencies only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit
      - run: pnpm test:integration
      # Phase 6 (T-12): P1 never evicted, shared assets kept, retention respected, interrupted eviction safe, index updated, deletion distinct from eviction. Blocking on both architectures.
      - name: Storage safety suite
        run: pnpm test:storage-safety
      # Phase 7 (D-08): limits, offline behaviour, privacy (no search text stored when disabled), provenance, scoring, kill switch, property tests. Blocking on both architectures.
      - name: Discovery suite
        run: pnpm test:discovery
      # Phase 9 (H-01): SIGKILL at each stage, power loss under WAL, graceful shutdown, failure messages, backup and restore. Blocking on both architectures.
      - name: Reliability suite
        run: pnpm test:reliability
      # Phase 9 (H-03): authorisation matrix over every route, SSRF corpus at every fetch entry point, XSS corpus in real browsers.
      # Blocking on Chromium and Firefox; WebKit isolation runs in the advisory browser step until it has a track record on CI.
      - name: Security suite
        env:
          SECURITY_BROWSERS: chromium,firefox
        run: pnpm test:security
      # The browser suite is timing-sensitive on shared runners (a different test flakes each run), so it runs on x64 only,
      # retries twice, and is advisory (continue-on-error) until the flaky specs are stabilised.
      - name: Browser end-to-end tests (advisory)
        if: runner.arch == 'X64'
        continue-on-error: true
        run: pnpm test:e2e --retries=2
      # H-11: the cross-browser subset (docs/browser-support.md). One engine per step: they share ports 25000-25002.
      - name: Browser end-to-end tests, Firefox (advisory)
        if: runner.arch == 'X64'
        continue-on-error: true
        run: pnpm test:e2e:firefox --retries=2
      - name: Browser end-to-end tests, WebKit (advisory)
        if: runner.arch == 'X64'
        continue-on-error: true
        run: pnpm test:e2e:webkit --retries=2
      - run: node scripts/licence-audit.mjs
