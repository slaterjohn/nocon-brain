name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Builds every image (server, web, renderer) so a broken Dockerfile fails CI. Nothing is pushed.
  images:
    name: images (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      # A throwaway value satisfies compose's required-variable check; build never uses it.
      - run: docker compose --profile renderer build
        env:
          NCB_PROXY_SECRET: ci-build-only
      # Acceptance 1: the default stack starts healthy on this architecture and the web port answers.
      # HB-02: on Linux, `web` sits on `frontend` (IP masquerading off) and `backend` (internal), so it must not reach the internet.
      # `server` is deliberately on `egress` (it fetches pages), so it is not checked here; compose.offline.yml removes that in the next step.
      - name: Compose up, health and egress check (HB-02)
        env:
          NCB_PROXY_SECRET: ci-compose-only-${{ github.run_id }}
        run: |
          docker compose up -d --wait --wait-timeout 300
          curl -fsS -o /dev/null -w "web %{http_code}\n" http://127.0.0.1:3000/ || { docker compose logs --tail 80; exit 1; }
          rc=0
          for svc in web; do
            if docker compose exec -T "$svc" node -e "fetch('https://example.com',{signal:AbortSignal.timeout(6000)}).then(()=>process.exit(1),()=>process.exit(0))"; then
              echo "PASS  $svc cannot reach https://example.com"
            else
              echo "FAIL  $svc REACHED https://example.com"; rc=1
            fi
          done
          docker compose down -v
          exit $rc
      # H-06 / HB-21: the whole stack on internal networks only, egress proof and tests/offline/check.mjs from inside.
      - name: Offline stack test
        env:
          NCB_SKIP_BUILD: "1"
        run: scripts/offline-test.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-3engines-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers and system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install Playwright system dependencies only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit
      - run: pnpm test:integration
      # Phase 6 (T-12): P1 never evicted, shared assets kept, retention respected, interrupted eviction safe, index updated, deletion distinct from eviction. Blocking on both architectures.
      - name: Storage safety suite
        run: pnpm test:storage-safety
      # Phase 7 (D-08): limits, offline behaviour, privacy (no search text stored when disabled), provenance, scoring, kill switch, property tests. Blocking on both architectures.
      - name: Discovery suite
        run: pnpm test:discovery
      # Phase 9 (H-01): SIGKILL at each stage, power loss under WAL, graceful shutdown, failure messages, backup and restore. Blocking on both architectures.
      - name: Reliability suite
        run: pnpm test:reliability
      # Phase 9 (H-03): authorisation matrix over every route, SSRF corpus at every fetch entry point, XSS corpus in real browsers.
      # Blocking on Chromium and Firefox; WebKit isolation runs in the advisory browser step until it has a track record on CI.
      - name: Security suite
        env:
          SECURITY_BROWSERS: chromium,firefox
        run: pnpm test:security
      # Phase 9 (HB-09): the known flakes have root-cause fixes, so the browser suite blocks. x64 only (arm64 unmeasured, HB-09).
      # One retry absorbs runner hiccups; Playwright still reports any retried test as flaky, and those get fixed, not ignored.
      - name: Browser end-to-end tests
        if: runner.arch == 'X64'
        run: pnpm test:e2e --retries=1
      # H-11: the cross-browser subset (docs/browser-support.md). One engine per step: they share ports 25000-25002.
      - name: Browser end-to-end tests, Firefox
        if: runner.arch == 'X64'
        run: pnpm test:e2e:firefox --retries=1
      # WebKit stays advisory until it has a few green CI runs behind it (first ran in CI run 41594122637).
      - name: Browser end-to-end tests, WebKit (advisory)
        if: runner.arch == 'X64'
        continue-on-error: true
        run: pnpm test:e2e:webkit --retries=2
      - run: node scripts/licence-audit.mjs
