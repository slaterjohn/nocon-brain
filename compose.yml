# NoConBrain production stack.
#   cp .env.example .env     (then set NCB_PROXY_SECRET, see the file)
#   docker compose up -d --wait
# Optional services: docker compose --profile searxng up -d --wait   (or --profile renderer, see the renderer service)
name: ${COMPOSE_PROJECT_NAME:-nocon-brain}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging
  stop_grace_period: 30s

services:
  server:
    image: nocon-brain/server:${NCB_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      target: runtime
    <<: *hardening
    # Anything set in .env (including optional NCB_* settings) reaches the container. "environment:" wins over it,
    # so only the values compose must control are listed below.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      NCB_PROXY_SECRET: ${NCB_PROXY_SECRET:?Set NCB_PROXY_SECRET in .env (openssl rand -hex 32)}
      NCB_APP_URL: ${NCB_APP_URL:-http://localhost:3000}
      NCB_API_HOST: 0.0.0.0
      NCB_API_PORT: 3001
      NCB_ARCHIVE_HOST: 0.0.0.0
      # The container listens on the same port the host publishes, so URLs built from this port are right.
      NCB_ARCHIVE_PORT: ${NCB_ARCHIVE_PORT:-3002}
      NCB_DATA_DIR: /data
      NCB_VOLUMES_ALLOWED_ROOTS: ${NCB_VOLUMES_ALLOWED_ROOTS:-/volumes}
      NCB_TZ: ${NCB_TZ:-UTC}
      # Renderer (profile `renderer`). Empty means off: no forward proxy is started and nothing is ever rendered.
      NCB_RENDERER_URL: ${NCB_RENDERER_URL:-}
      NCB_RENDERER_SECRET: ${NCB_RENDERER_SECRET:-${NCB_PROXY_SECRET:?Set NCB_PROXY_SECRET in .env (openssl rand -hex 32)}}
      NCB_RENDER_PROXY_PORT: ${NCB_RENDER_PROXY_PORT:-3128}
    ports:
      # The browser loads archived frames from this port directly, so it is published. The API (3001) is not:
      # the web container proxies it over the internal `backend` network.
      - "${NCB_ARCHIVE_BIND:-0.0.0.0}:${NCB_ARCHIVE_PORT:-3002}:${NCB_ARCHIVE_PORT:-3002}"
    volumes:
      - ncb-data:/data
      # Storage root for blobs and ZIMs. A name (the default) is a Docker volume; a path such as /mnt/ssd/ncb is a bind mount
      # and must be writable by UID 1000. More roots: add a line here and list the container path in NCB_VOLUMES_ALLOWED_ROOTS.
      - ${NCB_VOLUME_PATH:-ncb-volume}:/volumes/default
    read_only: true
    tmpfs:
      - /tmp:size=128m,uid=1000,gid=1000
    mem_limit: ${NCB_SERVER_MEMORY:-768m}
    cpus: ${NCB_SERVER_CPUS:-2.0}
    pids_limit: 256
    networks: [backend, egress, render]
    # The image HEALTHCHECK (GET /api/system/health) applies: migrations ran and the database is writable.

  web:
    image: nocon-brain/web:${NCB_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    <<: *hardening
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://server:3001
      NCB_PROXY_SECRET: ${NCB_PROXY_SECRET:?Set NCB_PROXY_SECRET in .env (openssl rand -hex 32)}
      HOSTNAME: 0.0.0.0
      PORT: ${NCB_WEB_PORT:-3000}
      # The web app lets the browser frame the archive listener (CSP frame-src), so it needs the same address.
      NCB_ARCHIVE_PORT: ${NCB_ARCHIVE_PORT:-3002}
      NCB_ARCHIVE_PUBLIC_URL: ${NCB_ARCHIVE_PUBLIC_URL:-}
    depends_on:
      server: { condition: service_healthy }
    ports:
      - "${NCB_WEB_BIND:-0.0.0.0}:${NCB_WEB_PORT:-3000}:${NCB_WEB_PORT:-3000}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=1000
      - /app/apps/web/.next/cache:size=128m,uid=1000,gid=1000
    mem_limit: ${NCB_WEB_MEMORY:-384m}
    pids_limit: 128
    networks: [frontend, backend]

  # Optional metasearch for the SearXNG provider. Start with: docker compose --profile searxng up -d --wait
  # In NoConBrain, set the provider URL to http://searxng:8080. No port is published.
  searxng:
    image: searxng/searxng:${NCB_SEARXNG_VERSION:-latest}
    profiles: [searxng]
    <<: *hardening
    user: "977:977"  # the image's own searxng user; with cap_drop ALL the entrypoint could not switch to it
    environment:
      SEARXNG_SECRET: ${NCB_SEARXNG_SECRET:-${NCB_PROXY_SECRET:?Set NCB_PROXY_SECRET in .env (openssl rand -hex 32)}}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=977,gid=977
      - /var/cache/searxng:size=64m,uid=977,gid=977
    mem_limit: ${NCB_SEARXNG_MEMORY:-384m}
    pids_limit: 256
    networks: [backend, egress]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional renderer (task C-16): Playwright with chromium_headless_shell, for pages that are empty until their scripts run.
  # Off by default, and the stack is complete without it. To turn it on, put these two lines in .env and run `docker compose up -d --wait`:
  #   COMPOSE_PROFILES=renderer
  #   NCB_RENDERER_URL=http://renderer:8080
  # The renderer sits on the internal-only `render` network. Its only way out is the guarded forward proxy that `server` runs on
  # port 3128 of that network (same SSRF checks as the server's own fetcher), so it cannot reach the internet or the LAN directly.
  # Chromium's own sandbox needs unprivileged user namespaces and chroot, which Docker's default seccomp profile blocks; docker/renderer/seccomp.json
  # is Playwright's profile that allows them (with CAP_SYS_CHROOT, the one capability added back). On a host that forbids user namespaces (some hardened Ubuntu settings) the renderer will not start.
  renderer:
    image: nocon-brain/renderer:${NCB_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/renderer/Dockerfile
    profiles: [renderer]
    <<: *hardening
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/renderer/seccomp.json
    # Playwright's seccomp profile allows chroot() only for a container that holds CAP_SYS_CHROOT, and Chromium's sandbox calls it.
    # Everything else stays dropped.
    cap_add: [SYS_CHROOT]
    init: true
    environment:
      NODE_ENV: production
      PORT: 8080
      NCB_RENDER_PROXY_URL: http://server:${NCB_RENDER_PROXY_PORT:-3128}
      NCB_RENDERER_SECRET: ${NCB_RENDERER_SECRET:-${NCB_PROXY_SECRET:?Set NCB_PROXY_SECRET in .env (openssl rand -hex 32)}}
      NCB_RENDERER_RESTART_AFTER_PAGES: ${NCB_RENDERER_RESTART_AFTER_PAGES:-50}
    read_only: true
    tmpfs:
      - /tmp:size=256m,uid=1000,gid=1000
    shm_size: 256m
    # One page at a time. About 130 MB for the idle browser and 80 MB or more for each page; see docs/benchmarks.md.
    mem_limit: ${NCB_RENDERER_MEMORY:-1g}
    memswap_limit: ${NCB_RENDERER_MEMORY:-1g}
    cpus: ${NCB_RENDERER_CPUS:-2.0}
    pids_limit: 256
    networks: [render]
    # The image HEALTHCHECK (GET /health) applies.

networks:
  # web only. It carries web's published port. IP masquerade is off, so web has no route to the internet.
  frontend:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # web <-> server API (3001 is never published), and searxng. No route to the outside world.
  backend:
    internal: true
  # Normal bridge. server (downloads, online search) and searxng reach the internet through it. It also carries
  # the archive port that server publishes.
  egress: {}
  # server <-> renderer, and nothing else. Internal: no route to the internet or the LAN. `server` joins it to run the forward proxy.
  render:
    internal: true

volumes:
  ncb-data:
  ncb-volume:
